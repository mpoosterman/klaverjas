<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klaverjas Online</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- LOBBY -->
  <div id="screen-lobby" class="screen active">
    <div class="lobby-box">
      <h1>🃏 Klaverjas</h1>
      <p class="subtitle">Het klassieke Nederlandse kaartspel</p>
      <div class="form-group">
        <label>Jouw naam</label>
        <input id="nickname" type="text" maxlength="16" placeholder="Vul je naam in" />
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="create">Kamer aanmaken</button>
        <button class="tab" data-tab="join">Kamer joinen</button>
      </div>
      <div id="tab-create" class="tab-content active">
        <button id="btn-create" class="btn-primary">Kamer aanmaken</button>
      </div>
      <div id="tab-join" class="tab-content">
        <div class="form-group">
          <label>Kamernummer</label>
          <input id="room-code" type="text" maxlength="5" placeholder="bijv. AB12C" style="text-transform:uppercase" />
        </div>
        <button id="btn-join" class="btn-primary">Joinen</button>
      </div>
      <div id="lobby-error" class="error-msg hidden"></div>
    </div>
  </div>

  <!-- WACHTEN -->
  <div id="screen-waiting" class="screen">
    <div class="waiting-box">
      <h2>Wachten op tegenstander…</h2>
      <p>Deel deze code met je tegenstander:</p>
      <div class="room-code-display" id="display-code"></div>
      <div id="player-list"></div>
    </div>
  </div>

  <!-- SPEL -->
  <div id="screen-game" class="screen">
    <div id="top-bar">
      <div id="score-display"></div>
      <div id="trump-display"></div>
      <div id="turn-display"></div>
    </div>

    <div id="game-area">
      <!-- Left: my deck -->
      <div id="my-area">
        <div class="player-label" id="my-label">Jij</div>
        <div class="stack-grid" id="my-layout"></div>
        <div id="my-roem-display"></div>
      </div>

      <!-- Middle: trick + trump button -->
      <div id="middle-area">
        <div id="trick-area">
          <div id="trick-cards"></div>
        </div>
        <button id="btn-trump-ready" class="hidden">Ik ben klaar<br>om troef te kiezen</button>
        <div id="waiting-trump-msg" class="waiting-trump hidden"></div>
      </div>

      <!-- Right: opponent deck -->
      <div id="opp-area">
        <div class="player-label" id="opp-label"></div>
        <div class="stack-grid" id="opp-layout"></div>
      </div>
    </div>
  </div>

  <!-- TROEF KIEZEN MODAL -->
  <div id="modal-bidding" class="modal hidden">
    <div class="modal-box">
      <h2>Kies troef</h2>
      <p id="bidding-prompt">Op basis van je 4 zichtbare kaarten:</p>
      <div id="bidding-preview"></div>
      <div class="suit-buttons">
        <button class="suit-btn" data-suit="clubs">♣ Klaveren</button>
        <button class="suit-btn" data-suit="diamonds">♦ Ruiten</button>
        <button class="suit-btn" data-suit="hearts">♥ Harten</button>
        <button class="suit-btn" data-suit="spades">♠ Schoppen</button>
      </div>
    </div>
  </div>

  <!-- RONDE VOORBIJ MODAL -->
  <div id="modal-round" class="modal hidden">
    <div class="modal-box">
      <h2>Ronde voorbij</h2>
      <div id="round-summary"></div>
      <button id="btn-new-round" class="btn-primary">Volgende ronde</button>
    </div>
  </div>

  <!-- SPEL VOORBIJ MODAL -->
  <div id="modal-gameover" class="modal hidden">
    <div class="modal-box">
      <h2 id="gameover-title"></h2>
      <div id="gameover-summary"></div>
      <button id="btn-play-again" class="btn-primary">Opnieuw spelen</button>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
